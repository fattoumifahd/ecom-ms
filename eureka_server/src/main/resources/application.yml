spring:
  application:
    name: eureka_server
  cloud:
    config:
      enabled: true
  config:
    import: configserver:http://localhost:1111
server:
  port: 8761
eureka:
  client:
    fetch-registry: false
    register-with-eureka: false
logging:
  level:
    com.netflix.eureka: OFF
    com.netflix.discovery: OFF
