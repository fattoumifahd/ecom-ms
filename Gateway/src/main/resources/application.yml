spring:
  application:
    name: gateway
  cloud:
    config:
      enabled: true
  gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true

  config:
    import: optional:configserver:http://localhost:1111
  main:
    web-application-type: reactive

management:
   endpoints:
     web:
       exposure:
         include: *
     enabled-by-default: true

